[package]
name = "knightgym-core"
version = "0.1.0"
edition = "2024"

[dependencies]
rust_decimal = "1.33"
rust_decimal_macros = "1.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
slab = "0.4"

[dev-dependencies]
criterion = "0.5"
rand = "0.8"
rand_chacha = "0.3"

[[bench]]
name = "matching"
harness = false

[[bench]]
name = "latency"
harness = false
