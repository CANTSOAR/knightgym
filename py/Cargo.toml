[package]
name = "knightgym-rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "_rs"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
knightgym-core = { path = "../core" }
pyo3 = { version = "0.25", features = ["abi3-py39"] }
numpy = "0.25"
rand = "0.8"
rand_chacha = "0.3"
rust_decimal = "1.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4"] }
