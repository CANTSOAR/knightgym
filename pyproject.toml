[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "knightgym"
version = "0.1.0"
description = "Order-book RL environments on a real price-time matching engine"
requires-python = ">=3.9"
dependencies = ["numpy", "gymnasium>=1.0"]

[project.optional-dependencies]
rl = ["stable-baselines3", "matplotlib", "pettingzoo"]
test = ["pytest"]

[tool.maturin]
manifest-path = "py/Cargo.toml"
python-source = "python"
module-name = "knightgym._rs"
features = ["extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
